# Discussions is deliberately NOT linked here. It is switched off for this repository, and turning it on
# would create a second inbox to check while the first one is still quiet — so questions go to the issue
# tracker instead, via the "Question or inquiry" form, where they land in the queue that is actually
# watched. When questions start drowning the real work, GitHub converts an issue to a discussion in one
# click, and that is the moment to reconsider — not before.
blank_issues_enabled: false
contact_links:
  - name: 🔒 Security vulnerability — report privately
    url: https://github.com/Alayra-Systems-Pvt-Limited/Alayra-Nexus/security/policy
    about: Never open a public issue for a security problem. A public report is a public disclosure, with a window before anyone can upgrade.
  - name: 📖 Documentation
    url: https://github.com/Alayra-Systems-Pvt-Limited/Alayra-Nexus#readme
    about: Quick start, standalone mode, configuration reference and the API surface.
