name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: these jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Both clients (Phase S2): Postgres for server mode, SQLite for standalone. Generating only
      # the first would leave every engine-parity check unable to load its other half.
      - run: npm run db:generate
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Both clients (Phase S2): Postgres for server mode, SQLite for standalone. Generating only
      # the first would leave every engine-parity check unable to load its other half.
      - run: npm run db:generate
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # A throwaway Redis so the KV parity suite can run its real-Redis half. Without it that half
    # skips, the twins are only ever checked against themselves, and a translation error in one of
    # the six Lua scripts would ship silently — which is the entire failure mode the suite exists
    # to prevent. It is emptied by the tests, so it must never be anything but disposable.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # And a throwaway PostgreSQL, for the same reason (Phase S2.1): the SQL dialect twins are
      # checked by running both halves against both real engines. Without it that suite skips, the
      # SQLite variants are never executed, and a mistranslation ships — four of the seven ways they
      # can be wrong produce no error at all, just a wrong number on the dashboard. The harness
      # drops and recreates this database's schema, so it must never be anything but disposable.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_parity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Both clients (Phase S2): Postgres for server mode, SQLite for standalone. Generating only
      # the first would leave every engine-parity check unable to load its other half.
      - run: npm run db:generate
      - run: npm test
        env:
          PARITY_REDIS_URL: redis://localhost:6379
          PARITY_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_parity

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Both clients (Phase S2): Postgres for server mode, SQLite for standalone. Generating only
      # the first would leave every engine-parity check unable to load its other half.
      - run: npm run db:generate
      - run: npm run build

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Hard gate: anything that ships to production must be clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      # Informational: dev-tooling advisories are surfaced but never block a release.
      - name: Audit all dependencies (informational)
        run: npm audit || true

  # ── Dashboard (Phase 7 redesign) ──────────────────────────────────────────────
  # The operator dashboard is a separate Vite + Preact app under web/ that builds to static
  # assets. Its own lint / typecheck / test / build gate runs on every push so a UI change can
  # never break the console or ship broken to a user.
  ui:
    name: UI (web dashboard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit UI production dependencies
        run: npm audit --omit=dev --audit-level=low

      # The published demo is a build artefact committed to docs/demo, which means it can silently
      # fall behind the dashboard it is supposed to be showing — and a demo that misrepresents the
      # product is worse than no demo. Rebuilding here and diffing makes staleness a failed check
      # with an obvious fix, instead of something a visitor notices first.
      - name: Rebuild the static demo
        run: npm run build:demo
      # ADVISORY FOR NOW, deliberately. The rebuild is byte-identical when repeated on one machine,
      # but whether a Linux runner reproduces a tree built on another OS is unproven — and a gate
      # that turns red for a reason unrelated to the change in front of it blocks every pull request
      # and teaches people to ignore CI. Promote to blocking (drop continue-on-error) once this step
      # has been seen to pass on a run where docs/demo really was current.
      - name: Warn if the committed demo is out of date
        continue-on-error: true
        working-directory: .
        run: |
          if ! git diff --quiet -- docs/demo; then
            echo "::warning::docs/demo differs from a fresh build. If the dashboard changed, run 'npm run build:demo' in web/ and commit the result."
            git diff --stat -- docs/demo
            exit 1
          fi
          echo "docs/demo matches a fresh build."

  # Standalone proof (S2.4): the compiled gateway started in an empty directory with no
  # DATABASE_URL and no REDIS_URL — exactly what `npx @alayra/nexus` does — then driven over HTTP.
  # It builds its own SQLite database, claims an owner, serves every dashboard read, writes, and
  # signs out.
  #
  # Deliberately has NO service containers: no Postgres, no Redis, no Docker pull. That makes it the
  # cheapest job here and the only one that proves the zero-configuration path a first-time user
  # takes — and it is the job that would have caught S1's in-memory KV crashing a real boot on a
  # Redis command nothing in our code calls, which every unit test and type check had passed.
  standalone:
    name: Standalone (SQLite + in-memory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      # The DDL a standalone gateway executes on first run is a committed artefact. A unit test can
      # tell that the schema FILE is stale; only regenerating can tell that this is.
      - name: Check the generated SQLite schema and DDL are current
        run: npm run db:sqlite-schema -- --check
      - run: npm run build
      - run: npm run smoke:standalone

  # ── The measured findings, guarded (2026-08-09) ───────────────────────────────────────────────
  #
  # Three real defects were found by measurement and fixed, and until this job existed nothing would
  # have noticed any of them coming back: a response cache that serves nothing (#81), a database
  # query per pool the router walks (#77), and three Redis round trips per candidate key (#78). All
  # three pass typecheck, lint and the entire unit suite in their broken form — they were found by
  # running the gateway and counting, and only counting will find them again.
  #
  # Counts and correctness only, never latency, for the same reason spelled out on the e2e job
  # below: a shared runner's timings are noise, a flaky gate gets ignored, and an ignored gate is
  # worse than none. A count is the same number here as on a laptop.
  bench-guard:
    name: Benchmark guard (counts, not latency)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      # SQLite for the database and a real Redis for the KV: the Redis check needs a real one, and
      # the query check is about our own query COUNT, which does not depend on the engine.
      - name: Assert the measured findings have not regressed
        run: npm run bench:guard
        env:
          GUARD_REDIS_URL: redis://127.0.0.1:6379

  # End-to-end proof (P7.15): the compiled gateway, a real PostgreSQL, a real Redis, and a
  # real browser. Everything above tests our code with stand-ins; this job is the one that
  # would have caught the bugs humans kept finding by clicking — /v1/v1 on the Connect page,
  # the bodyless-request rejections, the double-spaced provider auth header. Latency is
  # deliberately NOT asserted anywhere in it: shared-runner timings are noise, a flaky gate
  # gets ignored, and an ignored gate is worse than none.
  e2e:
    name: End-to-end (Postgres + Redis + browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Both clients (Phase S2): Postgres for server mode, SQLite for standalone. Generating only
      # the first would leave every engine-parity check unable to load its other half.
      - run: npm run db:generate
      - run: npm run build
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npm run lint
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Run the suite against the compiled gateway
        run: npx playwright test
        working-directory: e2e
        env:
          # Both packages were just built above; the harness must not rebuild them.
          E2E_SKIP_BUILD: '1'
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # ── The container, built and actually started (2026-08-04) ────────────────────────────────────
  #
  # The image is published by release.yml, which until now was also the ONLY thing that built it. A
  # Dockerfile mistake therefore passed every check here, merged, and was discovered at release time
  # — or, once, after a deployment had already restart-looped on it.
  #
  # That failure is the shape of this job. Prisma 7 moved the connection string out of
  # prisma/schema.prisma (copied into the image) and into prisma.config.ts (not copied), so
  # `prisma migrate deploy` had nowhere to read a URL from. It was missed twice over: no PR built the
  # image, and the by-hand check that WAS done started the container without a DATABASE_URL — which
  # skips the migration entirely (see CMD), exercising SQLite end to end while never touching the
  # Postgres path that was broken.
  #
  # So building is not enough, and this STARTS it against a real database. `migrate deploy` running
  # for real is the assertion; /ready answering is the proof it survived it.
  #
  # Nothing is pushed. Publishing stays in release.yml, which alone holds the registry credentials.
  docker:
    name: Container (build + run on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # load, not push: the image has to exist locally for the run below. The GitHub Actions cache
      # keeps this from rebuilding the whole toolchain on every pull request.
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nexus:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The real thing: the migration this image runs at startup, against a real PostgreSQL.
      # `--network host` so the container reaches the service container on localhost.
      - name: Start it on PostgreSQL and wait for /ready
        run: |
          docker run -d --name nexus --network host \
            -e DATABASE_URL="postgresql://nexus:nexus@127.0.0.1:5432/nexus" \
            -e MASTER_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            nexus:ci
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/ready; then
              echo "ready after ${i}s"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' nexus)" != "true" ]; then
              echo "::error::the container exited before answering"; docker logs nexus; exit 1
            fi
            sleep 1
          done
          echo "::error::the container never answered /ready"; docker logs nexus; exit 1
      # Proves the migration RAN, rather than the gateway having started despite skipping it — which
      # is exactly what an empty DATABASE_URL would have done, silently.
      - name: Prove the migration actually ran
        run: |
          docker logs nexus 2>&1 | grep -q "migrations have been successfully applied" || {
            echo "::error::migrate deploy did not report success"; docker logs nexus; exit 1; }
      - name: Show the logs when something failed
        if: failure()
        run: docker logs nexus || true
