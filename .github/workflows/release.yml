name: Release

# Publishes a multi-arch container image to the GitHub Container Registry and Docker Hub on every
# version tag (e.g. v1.0.0). Can also be run manually from the Actions tab.
#
# Two registries on purpose: GHCR sits next to the source and needs no extra account, but exposes no
# public pull counter. Docker Hub is where most people look first and is the only one that reports
# pulls — which is why the README's pulls badge reads from there. One build per architecture, pushed
# to both, so the digests are identical and neither can drift from the other.
#
# ── Why one job per architecture instead of one emulated build ────────────────────────────────────
# Until 1.4.0 this was a single `docker buildx build --platform linux/amd64,linux/arm64` under QEMU.
# That broke without a line of ours changing: the `node:22-alpine` digest moved, and `npm ci` began
# dying under emulation with `qemu: uncaught target signal 4 (Illegal instruction)` — exit 132. The
# arm64 image had only ever been produced by emulating an instruction set, and emulation is a
# guess that can stop being right at any upstream bump.
#
# GitHub's arm64 runners are free for public repositories, so each architecture is now built on
# hardware that actually is that architecture. The class of failure goes away rather than being
# pinned around, and an arm64 build stops taking ten times as long as its amd64 twin.
#
# The cost is a two-stage shape. Each build pushes an untagged, digest-addressed image (no tag can
# name half a multi-arch image without lying about it while the other half is still building), and a
# merge job then joins the digests into one manifest list and puts the tags on that. So the tags
# appear once, atomically, pointing at something complete.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.3.0). Leave blank to publish only :latest.'
        required: false
        type: string

# Least-privilege: read the repo, write the package (image).
permissions:
  contents: read
  packages: write

env:
  IMAGE:     ghcr.io/alayra-systems-pvt-limited/alayra-nexus
  IMAGE_HUB: docker.io/alayrasystems/nexus

jobs:
  # ── Nothing is published until this passes ──────────────────────────────────────────────────────
  # A release workflow's real failure mode is not failing to publish. It is publishing something
  # broken, which cannot be taken back: npm never reissues a version, and a bad `:latest` is pulled
  # by everyone before anyone notices.
  #
  # The last step is the one that matters most. It packs the actual tarball, installs it into an
  # empty directory and drives the result over HTTP — so what gets tested is the artefact about to
  # be published, not the repository it came from. Four bugs in S4 existed only in that gap.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      # Same throwaway pair as CI: without them the engine-parity suites skip, and a mistranslated
      # SQL twin ships silently — four of the seven ways they can be wrong produce no error at all,
      # just a wrong number on the dashboard.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_parity
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          PARITY_REDIS_URL: redis://localhost:6379
          PARITY_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_parity

      - name: Dashboard
        run: npm ci && npm run typecheck && npm test
        working-directory: web

      - name: The published package, installed and driven
        run: npm run smoke:npx

  build:
    name: Build ${{ matrix.platform }}
    needs: [verify]
    runs-on: ${{ matrix.runner }}
    strategy:
      # Don't cancel arm64 because amd64 failed. Two failures name two problems; one failure plus a
      # cancellation names one and hides the other.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Derive a filesystem-safe platform name
        # `linux/amd64` cannot be an artifact name. Used for the cache scope and the digest artifact.
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: actions/checkout@v7

      # No setup-qemu-action: that is the thing being removed. Each runner is native.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A fork without these secrets will stop here rather than half-publishing; the GHCR push above
      # needs no account beyond the repo's own token.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_HUB }}
          # Tags are applied in the merge job, to the manifest list — nothing here consumes
          # `outputs.tags`. The patterns are still declared because the automatic
          # `org.opencontainers.image.version` LABEL is derived from them: without the semver
          # patterns it falls back to the raw ref name, and 1.4.0 shipped labelled `v1.4.0` where
          # every release before it was labelled `1.3.2`, `1.3.1` and so on.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Alayra Nexus
            org.opencontainers.image.vendor=Alayra Systems

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # Both registry names in one output: the manifest is byte-identical either way, so the two
          # registries receive the same digest from a single build rather than from two.
          outputs: type=image,"name=${{ env.IMAGE }},${{ env.IMAGE_HUB }}",push-by-digest=true,name-canonical=true,push=true
          # Scoped per architecture. A shared scope would have the two jobs evicting each other's
          # layers on every run, which reads as a flaky cache rather than as a misconfigured one.
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # ── Prove the image runs, before any tag can point at it ────────────────────────────────────
      # Started with NO DATABASE_URL, which is the configuration that exposed three separate
      # defects in 1.4.0 — an unconditional migration, an image that had never contained the SQLite
      # client, and a volume mount point owned by root while the gateway runs unprivileged. Every
      # one of them was invisible to a Postgres deployment, so nothing else in this pipeline would
      # have caught them.
      #
      # This runs inside the matrix job on purpose: each architecture tests its own image on its own
      # hardware, with no emulation and no extra job to plumb digests through.
      - name: Run the image with no database
        env:
          VOLUME: nexus-smoke-data
          BIND:   ${{ github.workspace }}/nexus-smoke-bind
        run: |
          set -euo pipefail
          REF='${{ env.IMAGE }}@${{ steps.build.outputs.digest }}'
          docker pull -q "$REF"
          KEY=$(openssl rand -hex 32)

          # Start the image and wait for it to answer. Everything after the container name is passed
          # straight through to `docker run`, which is how each scenario below supplies its own mount.
          start_and_wait () {
            local name=$1; shift
            docker run -d --name "$name" -p 3000:3000 \
              -e MASTER_ENCRYPTION_KEY="$KEY" \
              -e ADMIN_PASSWORD=ci-smoke-password \
              "$@" "$REF" >/dev/null

            local i
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000/health; then return 0; fi
              if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != "true" ]; then
                echo "::error::$name exited before answering."; docker logs "$name"; return 1
              fi
              sleep 2
            done
            echo "::error::$name never answered."; docker logs "$name"; return 1
          }

          # ── 1. The documented form: a named volume ────────────────────────────────────────────────
          # Docker seeds a fresh named volume from the image, ownership included, so this works
          # without the operator preparing anything.
          start_and_wait vol -v "$VOLUME:/app/.nexus"
          curl -fsS -o /dev/null http://127.0.0.1:3000/ready || { docker logs vol; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:3000/      || { docker logs vol; exit 1; }

          # It must have built its own database rather than found one, and said which engine it is
          # on. A gateway reporting Postgres here would mean it reached something it should not have.
          docker logs vol 2>&1 | grep -q 'Database created' || { docker logs vol; exit 1; }
          docker logs vol 2>&1 | grep -q 'SQLite'           || { docker logs vol; exit 1; }
          docker rm -f vol >/dev/null

          # ── 2. The same volume, a second container ────────────────────────────────────────────────
          # The whole point of the `-v` is that the data outlives the container, and nothing checked
          # it. `Database created` prints only when the database is new, so its ABSENCE here is the
          # assertion: this gateway found the first one's database instead of starting over.
          start_and_wait vol-again -v "$VOLUME:/app/.nexus"
          if docker logs vol-again 2>&1 | grep -q 'Database created'; then
            echo "::error::The volume did not persist — the gateway built a second database."
            docker logs vol-again; exit 1
          fi
          docker rm -f vol-again >/dev/null

          # ── 3. A bind mount, prepared the way the README says to prepare one ──────────────────────
          # This is the scenario that made this step fail the first time it ever ran. Docker creates a
          # missing bind source as ROOT and overlays it as-is, so an unprepared bind mount is
          # unwritable by a container that drops privileges — and no change to the image can fix that.
          # The working recipe is a directory you own plus `--user`, so that is what ships in the
          # README, and testing it here is what keeps it true.
          mkdir -p "$BIND"
          start_and_wait bind --user "$(id -u):$(id -g)" -v "$BIND:/app/.nexus"
          docker rm -f bind >/dev/null
          test -f "$BIND/nexus.db" || { echo "::error::No database in the bind mount."; exit 1; }

          echo "the ${{ matrix.platform }} image serves with no database, and keeps it"

      - name: Export the digest
        # The filename IS the digest; the file is empty. The merge job only needs the names.
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        env:
          # Annotate the manifest LIST, not the platform manifests. Labels on the platform images
          # are invisible to a registry browsing a multi-arch tag: GHCR's package page has read
          # "No description provided" since the first multi-arch release, because it looks for the
          # description in the index annotations and every release so far has shipped none.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_HUB }}
          # The semver patterns read the git tag, so they only produce anything on a tag push. A
          # manual run has to be told the version instead — `workflow_dispatch` executes the
          # workflow file *at the selected ref*, so re-dispatching an older tag would run that
          # tag's workflow, not this one. Dispatch from main and pass `version` instead.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest

      - name: Create the manifest list and push the tags
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail

          # An array, not a string: the description annotation contains spaces, and word splitting
          # would turn one annotation into six arguments.
          annotations=()
          while IFS= read -r annotation; do
            [ -n "$annotation" ] && annotations+=(--annotation "$annotation")
          done <<< "$ANNOTATIONS"
          if [ ${#annotations[@]} -eq 0 ]; then
            echo "::error::No annotations were derived; the package page would show no description"
            exit 1
          fi

          # The artifact filenames are the digests. Collect them first: an empty directory would
          # otherwise leave the glob unexpanded and hand `imagetools` the literal string `*`.
          digests=$(ls)
          if [ -z "$digests" ]; then
            echo "::error::No digests were produced by the build jobs"; exit 1
          fi
          echo "Joining $(echo "$digests" | wc -l) platform image(s):"; echo "$digests"

          # One manifest list per registry, from sources in that same registry — both already hold
          # every layer, so nothing is copied across the internet a second time.
          for image in "$IMAGE" "$IMAGE_HUB"; do
            # `case` rather than grep: the image name contains dots, and a regex would quietly treat
            # them as wildcards. This is an exact prefix match.
            tags=""
            while IFS= read -r tag; do
              case "$tag" in
                "$image:"*) tags="$tags -t $tag" ;;
              esac
            done <<< "$TAGS"

            # Guard against a metadata change quietly emitting nothing for one registry, which would
            # otherwise push an untagged manifest and look like a success.
            if [ -z "$tags" ]; then
              echo "::error::No tags were derived for $image"; exit 1
            fi

            sources=""
            for digest in $digests; do sources="$sources $image@sha256:$digest"; done

            # shellcheck disable=SC2086
            docker buildx imagetools create "${annotations[@]}" $tags $sources
          done

      - name: Show what was published
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$IMAGE_HUB"; do
            # Fails the job if the tag does not resolve, so a green run means the image is pullable.
            docker buildx imagetools inspect "$image:latest"
          done

  # ── npm, via OIDC — there is no token anywhere in this repository ──────────────────────────────
  # npm is configured to trust exactly one thing: this repository, this workflow filename. When the
  # job runs, GitHub itself mints a short-lived token asserting both facts and signs it; npm checks
  # that signature and those claims before allowing a publish. A workflow in any other repository
  # cannot make that assertion, and nothing long-lived exists here to leak or to expire.
  #
  # It also earns provenance for free: npm attaches a signed attestation tying the published tarball
  # to this commit and this workflow, which anyone can verify.
  #
  # `needs: build` rather than `needs: verify`: the images have to have been built AND started with
  # no database before this runs. A release where the package publishes and the container does not
  # work is worse than a release that fails outright, because only one half can be taken back.
  publish-npm:
    name: Publish to npm
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # the whole mechanism; without it there is nothing to sign
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          # Not cached: a release must resolve its dependencies fresh rather than from whatever a
          # previous run happened to leave behind.
          package-manager-cache: false

      # Node 22 ships npm 10, and trusted publishing needs 11.5.1 or newer.
      - run: npm install -g npm@latest

      # Runs our postinstall, which generates both Prisma clients. `npm publish` then runs prepack,
      # which builds the gateway and the dashboard — the only reason web/dist, gitignored and absent
      # from a clean checkout, can be inside the tarball at all.
      - run: npm ci

      # A re-run after a half-finished release must not fail on the half that already succeeded.
      # npm refuses to republish a version, correctly — so ask first, and say plainly which it was.
      - name: Publish, unless this version is already on npm
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published — nothing to do."
            exit 0
          fi

          npm publish
          echo "::notice::published $NAME@$VERSION"

      - name: Confirm the public can actually see it
        # A scoped package defaults to RESTRICTED. Publishing one privately looks identical to
        # publishing one publicly from in here — the difference only shows to someone outside the
        # organisation, which is everyone who matters. So ask the registry anonymously.
        #
        # With retries, because the registry is a CDN: a read issued seconds after a write can
        # legitimately miss, and this asks from outside the account that just wrote. 1.5.2 published
        # correctly to both registries and this step still failed on a 404, reporting a complete
        # release as a broken one. A check that cannot tell "not public" from "not replicated yet"
        # is worse than no check at all, because the first thing anyone learns is to distrust it.
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          for attempt in $(seq 1 10); do
            if npm --userconfig=/dev/null view "$NAME@$VERSION" version; then
              echo "::notice::$NAME@$VERSION is publicly visible."
              exit 0
            fi
            echo "not visible yet (attempt $attempt/10) — waiting for the registry to replicate"
            sleep 15
          done

          # Two and a half minutes is long past replication, so this is a real visibility problem.
          echo "::error::$NAME@$VERSION is not publicly visible."
          echo "If it did publish, the package is probably restricted: check 'npm access list packages'."
          exit 1
